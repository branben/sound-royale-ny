# Build from the repo-root Dockerfile, which COPYs backend/requirements.txt and runs
# `pip install -r requirements.txt` with no stale layer cache. (PR #367 pinned
# channels==4.1.0 to fix the daphne handshake_deferred WS crash; the previous
# Nixpacks auto-build cached the broken channels==4.0.0 layer and never reinstalled.)
[build]
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
releaseCommand = "python manage.py migrate --noinput"
dockerfilePath = "Dockerfile"

[[services]]
name = "sound-royale-backend"

[[services.env]]
DJANGO_SETTINGS_MODULE = "sound_royale_api.settings"
DEBUG = "False"
PORT = "8000"
SECRET_KEY = "${{RAILWAY_DJANGO_SECRET_KEY}}"
ALLOWED_HOSTS = "${{RAILWAY_ALLOWED_HOSTS}}"
DB_ENGINE = "django.db.backends.postgresql"
DB_HOST = "${{Postgres.PGHOST}}"
DB_NAME = "${{Postgres.PGDATABASE}}"
DB_USER = "${{Postgres.PGUSER}}"
DB_PASSWORD = "${{Postgres.PGPASSWORD}}"
DB_PORT = "${{Postgres.PGPORT}}"
REDIS_URL = "${{Redis.REDIS_URL}}"
CORS_ALLOWED_ORIGINS = "${{RAILWAY_CORS_ORIGINS}}"
SECURE_SSL_REDIRECT = "False"
SESSION_COOKIE_SECURE = "False"
CSRF_COOKIE_SECURE = "False"
