name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pullfrog-review:
    name: Pullfrog PR Review
    runs-on: ubuntu-latest
    # External service — don't block PR merge if Pullfrog is down
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pullfrog review
        id: review
        uses: pullfrog/pullfrog@v0
        with:
          prompt: |
            Review this pull request for:
            1. Security vulnerabilities (SQL injection, XSS, auth bypass)
            2. Code quality (dead code, complexity, naming)
            3. Architecture (proper layering, coupling, cohesion)
            4. Django/Channels best practices (async safety, ORM usage, WebSocket handling)

            Focus on files in:
            - backend/game_engine/ (models, views, consumers, auth, urls)
            - src/ (React components, context, services)

            Output findings as JSON with fields: severity (critical/high/medium/low/info), file, line, description, fix.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post review comment
        if: steps.review.outputs.result
        run: |
          echo "${{ steps.review.outputs.result }}" > /tmp/review-result.json
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review-result.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
