name: Visual Dogfooding

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run visual dogfooding
        run: npx playwright test --config=playwright.visual.config.ts
        env:
          BASE_URL: https://soundroyale.pages.dev

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-dogfood-${{ github.run_number }}
          path: test-results/visual/
          retention-days: 7
