# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          # OmniRoute via Cloudflare Quick Tunnel (free Nous models)
          OPENAI_COMPATIBLE_BASE_URL: https://highlighted-condo-regime-bonds.trycloudflare.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: nous/meituan/longcat-2.0:free
          OPENAI_COMPATIBLE_CONTEXT: "32000"
          OPENAI_COMPATIBLE_MAX_OUTPUT: "8192"
